[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "spoberoz-warmup"
version = "0.1.0"
description = "分解首次调用的加载与初始化耗时，标出最有效的预热动作"
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [{ name = "spoberoz" }]
keywords = ["cli", "analysis", "observability", "evaluation"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Utilities",
]

[project.urls]
Homepage = "https://spoberoz.github.io"
Repository = "https://github.com/spoberoz/warmup"
Issues = "https://github.com/spoberoz/warmup/issues"

[project.scripts]
warmup = "warmup:main"

[tool.setuptools]
py-modules = ["warmup"]
